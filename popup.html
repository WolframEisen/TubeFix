<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>TubeFix</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1><img src="icons/icon48.png" alt="">TubeFix</h1>

  <section>
    <h2>Datumsformat</h2>
    <label>
      <span>In Videolisten (Startseite, Suche …)</span>
      <select id="listFormat"></select>
    </label>
    <label>
      <span>Auf der Videoseite</span>
      <select id="watchFormat"></select>
    </label>
    <label class="check">
      <input type="checkbox" id="watchTime"> Uhrzeit auf der Videoseite anzeigen
    </label>
  </section>

  <section>
    <h2>Videolisten</h2>
    <label class="check">
      <input type="checkbox" id="showSubs"> Abonnentenzahl hinter dem Kanalnamen
    </label>
  </section>

  <section>
    <h2>Beschreibung auf der Startseite</h2>
    <label class="check">
      <input type="checkbox" id="showDesc"> Auszug aus der Beschreibung anzeigen
    </label>
    <label>
      <span>Schriftgröße</span>
      <div class="range">
        <input type="range" id="descSize" min="1" max="2.4" step="0.1">
        <output id="descSizeValue"></output>
      </div>
    </label>
  </section>

  <section>
    <h2>Wiedergabe</h2>
    <label>
      <span>Bevorzugte Qualität</span>
      <select id="quality"></select>
    </label>
    <label class="check">
      <input type="checkbox" id="originalAudio"> Originalton statt „Automatisch synchronisiert“
    </label>
  </section>

  <footer>
    <button type="button" id="about">Über</button>
    <button type="button" id="reset">Zurücksetzen</button>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
